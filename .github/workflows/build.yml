name: Build

# One workflow, layered, for the same reason FBKSuppressor uses one: a release
# must ship the exact artifacts that were tested, and the simplest way to
# guarantee that is to publish the ones this run produced.
#
#   push to dev   -> pre-release, tagged vX.Y.Z-dev.<run number>
#   push to main  -> release,     tagged vX.Y.Z
#
# The version comes from gradle.properties, which is the single source of truth
# for the app's versionName too. A merge to main whose version already has a
# release fails loudly rather than overwriting it.
on:
  push:
    branches: [main, dev, 'claude/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  # ---------------------------------------------------------------------------
  # The pure-Kotlin core, as a fast gate.
  #
  # These three modules have no Android dependency, which is the whole reason
  # they are separate modules. They hold the transposition engine, the chart
  # parsers, the set list format and the band-sync rules - in other words every
  # part of the app where being wrong is silent. A wrong page number is obvious;
  # a chart transposed into G sharp major, or a follower left three pages behind
  # after a reconnect, is not.
  #
  # It runs in well under a minute with no Android SDK to install, against the
  # four-plus minutes the app build needs before it can report the same failure.
  core-tests:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # -PcoreOnly leaves the app module out of the build entirely, so this job
      # never touches the Android toolchain. It is also the command a contributor
      # runs on a laptop with no SDK installed.
      - name: Run the core suites
        run: ./gradlew -PcoreOnly coreTests

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: |
            core/*/build/reports/tests/test
            core/*/build/test-results/test
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  build:
    name: Build APK
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The tag this commit will be published under, worked out before anything
      # is compiled so it can be stamped into the APK.
      #
      # The in-app updater needs it. Every pre-release built from dev carries the
      # same versionName - only the tag carries the run number - so a build that
      # knew nothing but its version name could not tell one pre-release from
      # another, and would report "up to date" to everybody forever.
      #
      # Computed here rather than in the publish job so that the string stamped
      # into the APK and the string the release is published under are the same
      # string by construction. Two copies of this logic that drifted apart would
      # produce an app convinced it was a release that does not exist.
      - name: Work out the release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(sed -n 's/^droidmusic\.versionName=\(.*\)$/\1/p' gradle.properties | head -1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::Could not read droidmusic.versionName from gradle.properties"
            exit 1
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            tag="v${version}"
            title="DroidMusic ${tag}"
            prerelease=false
          else
            # Pre-release tags carry the run number, so every push to dev
            # produces a distinct, ordered tag without anyone bumping anything.
            tag="v${version}-dev.${{ github.run_number }}"
            title="DroidMusic ${tag} (pre-release)"
            prerelease=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "This build is $tag (prerelease=$prerelease)"

      # Appended rather than passed with -P on each command, so that every Gradle
      # invocation below picks it up and none can be forgotten. It changes only
      # the runner's checkout.
      #
      # A build from any other branch, and any build on a laptop, leaves this
      # unset - and the app then says it was built from source rather than
      # claiming to be a release nobody published.
      - name: Stamp the release tag into the build
        if: github.ref_name == 'main' || github.ref_name == 'dev'
        run: echo "droidmusic.releaseTag=${{ steps.release.outputs.tag }}" >> gradle.properties

      # Release builds are signed with a real key when the repository has one,
      # and with the debug key when it does not. Writing the keystore here rather
      # than in the Gradle file keeps the secret handling in one visible place.
      #
      # A fork has no secrets, and the right outcome there is a release APK that
      # still installs - clearly debug-signed - rather than a failed build. An
      # unsigned APK nobody can install is not safer, just less useful.
      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Which of the four arrived, by name.
          #
          # This exists because the previous version had exactly one failure
          # mode and no diagnosis: if the base64 secret was empty for any
          # reason - a typo in the name, secrets added under Environments or
          # Dependabot rather than Actions, an organisation secret not granted
          # to this repository - the build quietly debug-signed itself and said
          # only "no signing key configured".
          #
          # Only names are printed, never values. A secret's name is not a
          # secret, and GitHub masks the values in this log regardless.
          present=""
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            case "$name" in
              ANDROID_KEYSTORE_BASE64)   value="${KEYSTORE_BASE64:-}" ;;
              ANDROID_KEYSTORE_PASSWORD) value="${KEYSTORE_PASSWORD:-}" ;;
              ANDROID_KEY_ALIAS)         value="${KEY_ALIAS:-}" ;;
              ANDROID_KEY_PASSWORD)      value="${KEY_PASSWORD:-}" ;;
            esac
            if [ -n "$value" ]; then
              present="$present $name"
            else
              missing="$missing $name"
            fi
          done

          echo "Signing secrets this job can see:${present:- (none)}"
          echo "Signing secrets missing:${missing:- (none)}"

          if [ -n "$missing" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ -n "$present" ]; then
              echo "::error::Signing is half configured. Missing:${missing}. All four must be repository secrets under Settings -> Secrets and variables -> Actions; secrets added under Environments, Dependabot or Codespaces are not visible here."
            else
              echo "::warning::No signing secrets are visible to this job, so the release APK will be debug-signed with a key generated for this run. If you have added them, check they are *repository* secrets under Settings -> Secrets and variables -> Actions and that the names match exactly."
            fi
            exit 0
          fi

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but is not valid base64. It must be one line with no headers - certutil -encode adds both. Use PowerShell's [Convert]::ToBase64String, or base64 -w0."
            exit 1
          fi

          # Prove the keystore, its password and the alias agree, here, rather
          # than letting the signing task fail three minutes later with a
          # message about a keystore path.
          if ! keytool -list -keystore release.keystore \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > keytool.log 2>&1; then
            echo "::error::The keystore decoded, but its alias could not be opened with the password given. Check ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD. keytool said:"
            sed 's/^/  /' keytool.log
            exit 1
          fi
          grep -i "SHA256:" keytool.log | head -1 || true

          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release builds will be signed with the repository key."

      # Compile first, on its own, so a compile error is reported as a compile
      # error rather than as a lint task that happened to fail.
      #
      # The `tee` and the trailing grep exist because Gradle prints compiler
      # errors *before* a hundred and fifty lines of its own stack trace, which
      # puts them off the end of anything that reads the tail of a log - the
      # GitHub UI, the API, and a person in a hurry. Repeating them at the end
      # costs nothing and turns "scroll up and hunt" into "read the last line".
      - name: Compile
        run: |
          set -o pipefail
          ./gradlew :app:compileReleaseKotlin :app:compileDebugKotlin 2>&1 | tee compile.log || {
            echo "::group::Compiler errors"
            grep -E "^e: |^w: .*error" compile.log | sed 's|file:///home/runner/work/DroidMusic/DroidMusic/||' || true
            echo "::endgroup::"
            grep -E "^e: " compile.log | sed 's|file:///home/runner/work/DroidMusic/DroidMusic/||' \
              | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :app:lintRelease 2>&1 | tee lint.log

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      # A release AAB as well, so the same run can feed Play without a second
      # build from a different commit.
      - name: Bundle
        run: ./gradlew :app:bundleRelease

      # Which key actually signed the APK, read back out of the APK rather than
      # assumed from whether a keystore was configured.
      #
      # This exists because the failure it surfaces was invisible for three
      # releases: with no signing secrets the release APK falls back to the debug
      # keystore, and a fresh runner has no debug keystore, so AGP generates a new
      # one *per run*. Every release was therefore signed by a different key and
      # none could update any other - which presents on a phone as "conflicts with
      # an existing package" and nothing else.
      #
      # Printing the fingerprint into the release notes makes "can this build
      # update that one" a thing anybody can check by looking.
      - name: Read the signing certificate
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail

          apk=$(find app/build/outputs -name '*release*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No release APK to read a signature from"
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner not found; skipping the fingerprint"
            echo "fingerprint=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never let this step be the thing that fails the build. It is
          # reporting a fact about the APK, and a warning from apksigner about
          # some older signature scheme is not a reason to throw away a build
          # that has otherwise passed everything.
          certs=$("$apksigner" verify --print-certs "$apk" 2>/dev/null || true)
          digest=$(printf '%s\n' "$certs" \
            | sed -n 's/.*certificate SHA-256 digest: *\([0-9a-fA-F]*\).*/\1/p' | head -1)
          digest=${digest:-unknown}

          echo "fingerprint=$digest" >> "$GITHUB_OUTPUT"
          echo "Release APK signing certificate SHA-256: $digest"
          printf '%s\n' "$certs" | sed -n 's/.*certificate DN: *//p' | head -1

          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            echo "::warning::This APK is debug-signed with a key generated for this run. It cannot update, or be updated by, any other release. Set ANDROID_KEYSTORE_BASE64 and friends to fix this."

            # A pre-release that cannot update anything is a nuisance worth
            # shipping anyway - it is how people try the app at all right now.
            # A *release* that cannot be updated is a trap: somebody installs it,
            # and is then stuck on it until they uninstall and lose their set
            # lists. So main refuses rather than publishing one.
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "::error::Refusing to publish a release signed with a throwaway debug key. Every run generates a different one, so this build could never be updated in place. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets - see the README."
              exit 1
            fi
          fi

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          find app/build/outputs -name '*.apk' -exec cp {} staging/ \;
          find app/build/outputs -name '*.aab' -exec cp {} staging/ \;
          # The R8 mapping, so an obfuscated name in a crash report can be read
          # back. Without it "NoClassDefFoundError: u2.l" is the whole story and
          # there is no way to find out which class u2.l was.
          find app/build/outputs -name 'mapping.txt' \
            -exec cp {} staging/mapping-release.txt \; || true
          ls -la staging

      - uses: actions/upload-artifact@v4
        with:
          name: DroidMusic-apk
          path: staging/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 14
          if-no-files-found: ignore

      # The last thing in the job, so that whatever went wrong is the last thing
      # in the log. Everything above this - the artifact upload, the Gradle cache
      # save, the runner's own cleanup - adds a hundred lines after the failure,
      # which is exactly enough to push the actual error off the end of the log
      # tail that anyone or anything reads first.
      - name: What failed
        if: failure()
        shell: bash
        run: |
          echo "===================== FAILURE SUMMARY ====================="
          if [ -f compile.log ]; then
            grep -E "^e: " compile.log \
              | sed 's|file:///home/runner/work/DroidMusic/DroidMusic/||' \
              | sort -u || echo "(no compiler errors; the failure was later)"
          fi
          # Only the error lines. Lint writes several hundred lines of
          # explanation around them, which is what buried the actual problem
          # the first three times this failed.
          for report in app/build/reports/lint-results-release.txt lint.log; do
            [ -f "$report" ] || continue
            grep -E ": (Error|error):" "$report" \
              | sed 's|/home/runner/work/DroidMusic/DroidMusic/||' \
              | sort -u | head -20 && break
          done
          find app/build/test-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 grep -l "<failure" 2>/dev/null \
            | head -5 \
            | while read -r f; do
                echo "--- failing test: $f"
                grep -o 'message="[^"]*"' "$f" | head -3
              done
          echo "==========================================================="

    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}

  # ---------------------------------------------------------------------------
  # Publishing. Gated on the build, so a release can only ever contain artifacts
  # that passed both suites; the APKs stay downloadable from the run itself even
  # when this job declines to publish.
  publish:
    name: Publish ${{ github.ref_name == 'main' && 'release' || 'pre-release' }}
    needs: build
    # workflow_dispatch as well as push, purely as a recovery path: a run can
    # stall between the build finishing and this job being scheduled, and without
    # a manual trigger the only way to publish that commit would be to invent a
    # new one.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history and tags, so the changelog is generated against the previous
      # release rather than guessed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: DroidMusic-apk
          path: artifacts

      # The tag is not recomputed here. It was worked out in the build job and
      # stamped into the APK, and an APK that believes it is one release while
      # being published as another is exactly the bug an in-app updater turns
      # into a loop: the app checks, sees a tag it does not match, installs it,
      # and still does not match.
      - name: Check the tag is free
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$TAG" ]; then
            echo "::error::The build job did not report a release tag."
            exit 1
          fi

          # Refuse to clobber an existing release. Republishing over a tag would
          # silently replace an APK somebody may already have installed - and now
          # that the app updates itself, may already have been offered.
          if [ "${{ github.ref_name }}" = "main" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump droidmusic.versionName in gradle.properties before merging to main."
            exit 1
          fi

          echo "Publishing $TAG"

      - name: Name the files after the version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          mkdir -p dist

          shopt -s nullglob
          found=0
          for file in artifacts/*.apk artifacts/*.aab; do
            [ -e "$file" ] || continue
            base=$(basename "$file")
            case "$base" in
              *release*.apk) cp "$file" "dist/DroidMusic-${version}.apk" ;;
              *debug*.apk)   cp "$file" "dist/DroidMusic-${version}-debug.apk" ;;
              *.aab)         cp "$file" "dist/DroidMusic-${version}.aab" ;;
              *)             cp "$file" "dist/$base" ;;
            esac
            found=$((found + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No APK or AAB was found to publish"
            exit 1
          fi

          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -la dist

      - name: Compose release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Compare against the previous release of the same kind: a full release
          # against the last full release, a pre-release against whatever came last.
          if [ "${{ github.ref_name }}" = "main" ]; then
            previous=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease == false)] | sort_by(.createdAt) | last | .tagName // ""' || echo "")
          else
            previous=$(gh release list --limit 100 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | last | .tagName // ""' || echo "")
          fi

          {
            if [ "${{ github.ref_name }}" = "dev" ]; then
              echo "Automated pre-release from \`dev\`. Built and tested, but not a stable release."
              echo
            fi

            echo "Commit \`${GITHUB_SHA:0:8}\`. The music-theory, set list and band-sync suites"
            echo "passed on the JVM, and the app's own unit tests passed against the Android"
            echo "toolchain, before this APK was assembled."
            echo

            echo "## Install"
            echo
            echo "Download \`DroidMusic-${{ needs.build.outputs.version }}.apk\` and open it on the"
            echo "device. Android will ask you to allow installing from this source the first time."
            echo

            if [ "${{ needs.build.outputs.signed }}" != "true" ]; then
              echo "> [!WARNING]"
              echo "> **This build cannot update any other build, and no other build can update it.**"
              echo ">"
              echo "> No release signing key is configured for this repository, so the APK is signed"
              echo "> with the Android debug key - and a fresh CI runner generates a *new* debug key"
              echo "> every run. Android only lets an app be replaced by a package signed with the"
              echo "> same key, so every release here is a separate, unrelated app as far as the"
              echo "> installer is concerned."
              echo ">"
              echo "> Installing this over an existing DroidMusic fails with \"conflicts with an"
              echo "> existing package\". Uninstall first - which erases set lists and the list of"
              echo "> added folders - or set the signing secrets described in the README so that"
              echo "> releases share a key and can update each other."
              echo
            fi

            echo "Signing certificate: \`${{ needs.build.outputs.fingerprint }}\`. Only builds"
            echo "showing this same fingerprint can update one another."
            echo

            echo "Minimum Android 8.0 (API 26). Phones and tablets, portrait and landscape."
            echo

            echo "## Downloads"
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            echo "| \`DroidMusic-${{ needs.build.outputs.version }}.apk\` | Release build. This is the one to install. |"
            echo "| \`DroidMusic-${{ needs.build.outputs.version }}-debug.apk\` | Debug build, installs alongside the release one. |"
            echo "| \`DroidMusic-${{ needs.build.outputs.version }}.aab\` | App bundle, for Play Store upload. |"
            echo "| \`SHA256SUMS.txt\` | Checksums. |"
            echo

            echo "## First steps"
            echo
            echo "1. **Add a folder.** Any folder the system file picker can reach works, which"
            echo "   includes Google Drive, OneDrive, Dropbox, Box and Proton Drive - they all"
            echo "   publish a provider Android can read, so there is no separate sign-in."
            echo "2. **Check the page turns.** Tap the right two thirds to go forward, the left"
            echo "   third to go back. A Bluetooth or USB foot switch works with no setup on most"
            echo "   pedals; Settings has a learn mode for the rest."
            echo "3. **Try a session.** One device taps Start under Band session, the others tap"
            echo "   its name. Pull the leader's wifi and check the followers keep turning their"
            echo "   own pages - that is the behaviour worth testing before you rely on it."
            echo

            echo "## Changes"
            echo
            if [ -n "$previous" ] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
              echo "Since \`$previous\`:"
              echo
              git log --no-merges --pretty=format:'- %s' -n 60 "refs/tags/${previous}..HEAD"
              echo
            else
              echo "Recent commits:"
              echo
              git log --no-merges --pretty=format:'- %s' -20
              echo
            fi
          } > release-notes.md

          echo "Composed notes:"
          cat release-notes.md

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            "${{ needs.build.outputs.tag }}"
            --target "${{ github.sha }}"
            --title "${{ needs.build.outputs.title }}"
            --notes-file release-notes.md
          )
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" dist/*

          echo "### Published [${{ needs.build.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
