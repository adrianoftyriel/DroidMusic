# The version lives here and nowhere else. build.gradle.kts reads it for
# versionName/versionCode, and the release workflow reads it with sed to work out
# what tag to publish. Two copies of a version number is one copy too many.
droidmusic.versionName=0.1.1-dev
droidmusic.versionCode=2

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
